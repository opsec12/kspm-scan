name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check kspm tests

      - name: Run tests
        run: pytest -q

      - name: Dogfood — scan the example manifests
        run: |
          kspm manifests examples/hardened-deployment.yaml --fail-on HIGH
          kspm manifests examples/insecure-pod.yaml --fail-on NONE -o json --output-file insecure-report.json
          cat insecure-report.json

      - name: Upload example scan report
        uses: actions/upload-artifact@v4
        with:
          name: kspm-example-report-py${{ matrix.python-version }}
          path: insecure-report.json
