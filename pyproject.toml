[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kspm-scanner"
version = "0.1.0"
description = "A Kubernetes Security Posture Management (KSPM) scanner for workload security misconfigurations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "George" }]
keywords = ["kubernetes", "kspm", "security", "posture-management", "cis-benchmark", "devsecops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0",
    "kubernetes>=28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
kspm = "kspm.cli:main"

[tool.setuptools.packages.find]
include = ["kspm*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# UP045 ("X | None" instead of Optional[X]) is disabled: this project
# targets Python 3.9, where that syntax is invalid outside of annotations
# even with `from __future__ import annotations` for non-annotation uses
# (e.g. isinstance checks), so Optional[X] is used consistently instead.
ignore = ["UP045"]
